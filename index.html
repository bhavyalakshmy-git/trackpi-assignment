<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Post UI Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="app-header">
        <div class="header-left">
            <div class="logo">f</div>
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search Facebook">
            </div>
        </div>
        <div class="header-right">
            <button id="theme-toggle" class="nav-icon-btn" aria-label="Toggle theme">🌙</button>
            <div class="profile-menu-container">
                <div class="nav-avatar" id="profile-dropdown-btn">TA</div>
                <div class="dropdown-menu" id="profile-dropdown">
                    <p class="dropdown-title">Account Settings</p>
                    <hr>
                    <div class="dropdown-item">⚙️ Settings & Privacy</div>
                    <div class="dropdown-item">🙋‍♂️ Help & Support</div>
                    <div class="dropdown-item">🚪 Log Out</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="feed-container">
        <!-- Post Card -->
        <article class="post">
            <!-- Header Section -->
            <div class="post-header">
                <div class="avatar">TI</div>
                <div class="meta-info">
                    <div class="user-row">
                        <span class="username">@tech_insider</span>
                    </div>
                    <div class="timestamp-row">
                        <span class="timestamp">2 hours ago</span>
                        <span class="privacy-icon">🌐</span>
                    </div>
                </div>
                <button class="more-options-btn">•••</button>
            </div>

            <!-- Content Section -->
            <div class="post-content">
                <p>Just started my technical round internship assignment today. Building layouts with vanilla CSS is surprisingly fun!</p>
            </div>

            <!-- Engagement Analytics Row -->
            <div class="engagement-analytics">
                <div class="likes-metrics">
                    <span class="like-emoji-stack">👍</span>
                    <span class="like-counter" id="like-count">84</span>
                </div>
                <div class="comments-shares-metrics">
                    <span>12 comments</span>
                    <span>5 shares</span>
                </div>
            </div>

            <!-- Interactive Actions Row -->
            <div class="post-actions">
                <button class="action-btn" id="like-action-btn">
                    <span class="icon">👍</span> Like
                </button>
                <button class="action-btn">
                    <span class="icon">💬</span> Comment
                </button>
                <button class="action-btn">
                    <span class="icon">🔗</span> Share
                </button>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>
</html>
