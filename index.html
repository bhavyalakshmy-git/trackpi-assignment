<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Web UI Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Fixed Navigation Bar -->
    <header class="fb-header">
        <div class="header-left">
            <div class="fb-logo">f</div>
            <div class="fb-search-container">
                <span class="search-icon">
                    <svg viewBox="0 0 512 512" width="16" height="16"><path fill="currentColor" d="M505 442.7L405.3 343c-4.5-4.5-10.6-7-17-7H372c27.6-35.3 44-79.7 44-128C416 93.1 322.9 0 208 0S0 93.1 0 208s93.1 208 208 208c48.3 0 92.7-16.4 128-44v16.3c0 6.4 2.5 12.5 7 17l99.7 99.7c9.4 9.4 24.6 9.4 33.9 0l28.3-28.3c9.4-9.4 9.4-24.6.1-34zM208 336c-70.7 0-128-57.3-128-128s57.3-128 128-128 128 57.3 128 128-57.3 128-128 128z"/></svg>
                </span>
                <input type="text" placeholder="Search Facebook">
            </div>
        </div>

        <div class="header-center">
            <button class="nav-tab active" aria-label="Home">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M20 22h-5v-6h-6v6H4a1 1 0 0 1-1-1V10a1 1 0 0 1 .36-.77l8-6.67a1 1 0 0 1 1.28 0l8 6.67A1 1 0 0 1 21 10v11a1 1 0 0 1-1 1z"/></svg>
            </button>
            <button class="nav-tab" aria-label="Watch">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-12 11V7l7 3.5-7 3.5z"/></svg>
            </button>
            <button class="nav-tab" aria-label="Marketplace">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M21.6 6.13l-1.6-3.2A1 1 0 0 0 19.12 2.4H4.88a1 1 0 0 0-.88.53l-1.6 3.2A1 1 0 0 0 3 7.3V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7.3a1 1 0 0 0-.4-1.17zM12 17.5a4.5 4.5 0 1 1 4.5-4.5 4.5 4.5 0 0 1-4.5 4.5z"/></svg>
            </button>
            <button class="nav-tab" aria-label="Groups">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm7 11.5v-.5a5 5 0 0 0-5-5H10a5 5 0 0 0-5 5v.5a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5z"/></svg>
            </button>
        </div>

        <div class="header-right">
            <button id="theme-toggle" class="right-icon-btn" aria-label="Toggle Night Mode">🌙</button>
            <div class="profile-dropdown-wrapper">
                <div class="header-avatar" id="avatar-menu-trigger">TA</div>
                <div class="fb-dropdown" id="account-dropdown">
                    <div class="dropdown-user-card">
                        <div class="avatar large">TA</div>
                        <div>
                            <h4>Trackpi Aspirant</h4>
                            <p>See your profile</p>
                        </div>
                    </div>
                    <hr class="fb-divider">
                    <div class="dropdown-action-item">⚙️ Settings & Privacy</div>
                    <div class="dropdown-action-item">🙋‍♂️ Help & Support</div>
                    <div class="dropdown-action-item">🚪 Log Out</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Central Container Framework -->
    <main class="fb-feed-layout">
        
        <!-- "Create Post" Composer Box Component -->
        <section class="fb-card post-composer">
            <div class="composer-top">
                <div class="avatar">TA</div>
                <button class="composer-mock-input" id="open-composer-trigger">What's on your mind, Trackpi?</button>
            </div>
            <hr class="fb-divider">
            <div class="composer-bottom">
                <button class="composer-action"><span class="c-icon red">📹</span> Live video</button>
                <button class="composer-action"><span class="c-icon green">🖼️</span> Photo/video</button>
                <button class="composer-action"><span class="c-icon yellow">😊</span> Feeling/activity</button>
            </div>
        </section>

        <!-- Dynamic Feed Node Target Container -->
        <div id="dynamic-posts-feed-root"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
